<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 8rem;
            margin: 0;
            color: #38bdf8;
            text-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }
        h2 {
            font-size: 1.8rem;
            margin: 10px 0 20px;
            font-weight: 400;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            max-width: 400px;
            line-height: 1.6;
        }
        .sub-text {
            font-style: italic;
            color: #cbd5e1;
            margin-top: 20px;
            font-size: 1rem;
        }
        a {
            margin-top: 30px;
            display: inline-block;
            padding: 12px 28px;
            background-color: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.2s;
        }
        a:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>Oops! You've wandered into the void.</h2>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <div class="sub-text">Ceci n'est pas une page</div>
    <a href="/">Take Me Home</a>
</body>
</html>
